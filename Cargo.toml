[package]
name = "aether"
version = "2026.10.16"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rodio = { version = "0.19", default-features = false, features = [
    "symphonia-all",
] }
rustfft = "6.2"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "2.10", features = ["json"] }
urlencoding = "2.1"
zbus = { version = "4.4", features = ["blocking"] }
font-kit = "0.14"
souvlaki = "0.8.3"


